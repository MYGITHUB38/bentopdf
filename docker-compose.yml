services:
  bentopdf:
    # Fork local : l'image est construite depuis ce depot, pas tiree du registre
    # amont. Tirer ghcr.io/alam00000/bentopdf-simple deploierait le code amont et
    # perdrait silencieusement les correctifs de ce fork.
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Les trois valeurs Google sont publiques par construction (Vite les
        # inline dans le bundle). Jamais de client secret OAuth ici.
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_GOOGLE_API_KEY: ${VITE_GOOGLE_API_KEY:-}
        VITE_GOOGLE_APP_ID: ${VITE_GOOGLE_APP_ID:-}
        # AGPL art. 13 : les sources de CETTE version, pas celles de l'amont.
        VITE_SOURCE_URL: ${VITE_SOURCE_URL:-https://github.com/MYGITHUB38/bentopdf}
        SITE_URL: ${SITE_URL:-http://localhost:8080}
    image: bentopdf-fork:latest
    container_name: bentopdf
    restart: unless-stopped
    ports:
      - '8080:8080'
    # Pour les environnements IPv4 uniquement
    #environment:
    #  - DISABLE_IPV6=true
