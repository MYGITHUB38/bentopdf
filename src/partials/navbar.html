{{#if simpleMode}} {{> navbar-simple}} {{else}}
<nav class="bg-gray-900 border-b border-white/10 sticky top-0 z-30">
  <div class="container mx-auto px-4">
    <div class="flex justify-between items-center h-16">
      <div
        class="flex-shrink-0 flex items-center cursor-pointer"
        id="home-logo"
      >
        <img
          id="nav-logo"
          src="{{baseUrl}}{{#if brandLogo}}{{brandLogo}}{{else}}images/favicon-no-bg.svg{{/if}}"
          alt="{{#if brandName}}{{brandName}}{{else}}Bento PDF{{/if}} Logo"
          class="h-8 w-8"
        />
        <span id="nav-brand" class="text-white font-bold text-xl ml-2">
          <a href="/">{{#if brandName}}{{brandName}}{{else}}BentoPDF{{/if}}</a>
        </span>
      </div>
      <div id="nav-gdrive-container" class="flex items-center gap-3"></div>
    </div>
  </div>
</nav>
{{/if}}
